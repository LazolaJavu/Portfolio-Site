<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article | Lazola Javu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Syne+Mono&family=Nunito:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:        #f7f4ee;
      --surface:   #ffffff;
      --ink:       #1a1916;
      --ink-muted: #6b6860;
      --accent:    #c1440e;
      --accent-lt: #fae8e0;
      --blue:      #1a4a7a;
      --blue-lt:   #e0eaf5;
      --green:     #1a5c3a;
      --green-lt:  #ddf0e8;
      --amber:     #92620a;
      --amber-lt:  #fef3dc;
      --purple:    #4a2aad;
      --purple-lt: #ede8fb;
      --border:    #e4e0d8;
      --radius:    10px;
      --radius-lg: 16px;
      --font-head: 'Syne', sans-serif;
      --font-body: 'Nunito', sans-serif;
      --font-mono: 'Syne Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
      font-size: 16px;
    }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    /* ─── Nav (same as index) ──── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(247,244,238,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: .65rem 0;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 2rem;
    }
    .nav-logo { font-family: var(--font-head); font-weight: 800; font-size: 1.15rem; }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links a {
      font-family: var(--font-head);
      font-size: .875rem;
      font-weight: 500;
      color: var(--ink-muted);
      transition: color .2s;
    }
    .nav-links a:hover { color: var(--ink); }
    .nav-cta {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: .875rem;
      padding: .45rem 1.1rem;
      background: var(--ink);
      color: var(--bg);
      border-radius: var(--radius);
      transition: all .2s;
    }
    .nav-cta:hover { background: var(--accent); }
    @media (max-width: 640px) {
      .nav-links, .nav-cta { display: none; }
    }

    /* ─── Article layout ──── */
    .article-page {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 2rem 6rem;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: .78rem;
      color: var(--ink-muted);
      margin-bottom: 2.5rem;
    }
    .breadcrumb a { transition: color .2s; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb-sep { opacity: .4; }

    .article-cat-badge {
      display: inline-flex;
      align-items: center;
      padding: .25rem .75rem;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: .75rem;
      font-weight: 500;
      letter-spacing: .04em;
      margin-bottom: 1.25rem;
    }

    .article-h1 {
      font-family: var(--font-head);
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -.02em;
      margin-bottom: 1rem;
    }

    .article-meta {
      display: flex;
      align-items: center;
      gap: .75rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }
    .article-date, .article-read {
      font-family: var(--font-mono);
      font-size: .78rem;
      color: var(--ink-muted);
    }
    .meta-sep { color: var(--border); }
    .article-tags { display: flex; gap: .4rem; flex-wrap: wrap; }
    .article-tag {
      font-family: var(--font-mono);
      font-size: .72rem;
      color: var(--ink-muted);
      background: var(--surface);
      padding: .2rem .55rem;
      border-radius: 5px;
      border: 1px solid var(--border);
    }

    /* ─── Article body prose ──── */
    .article-body {
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--ink);
    }
    .article-body p { margin-bottom: 1.4rem; }
    .article-body h2 {
      font-family: var(--font-head);
      font-size: 1.4rem;
      font-weight: 700;
      margin: 2.5rem 0 .75rem;
      color: var(--ink);
    }
    .article-body h3 {
      font-family: var(--font-head);
      font-size: 1.15rem;
      font-weight: 700;
      margin: 2rem 0 .5rem;
    }
    .article-body ul, .article-body ol {
      padding-left: 1.5rem;
      margin-bottom: 1.4rem;
    }
    .article-body ul { list-style: disc; }
    .article-body ol { list-style: decimal; }
    .article-body li { margin-bottom: .4rem; }
    .article-body a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }
    .article-body a:hover { text-decoration-thickness: 2px; }
    .article-body strong { font-weight: 600; }
    .article-body em { font-style: italic; }
    .article-body blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1.25rem;
      margin: 1.75rem 0;
      color: var(--ink-muted);
      font-style: italic;
    }
    .article-body code {
      font-family: var(--font-mono);
      font-size: .85em;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .1em .35em;
    }
    .article-body pre {
      background: #1a1916;
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      overflow-x: auto;
      margin: 1.75rem 0;
    }
    .article-body pre code {
      font-family: var(--font-mono);
      font-size: .85rem;
      line-height: 1.6;
      background: none;
      border: none;
      padding: 0;
      color: #c8c4bc;
    }
    .article-body img {
      width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin: 1.75rem 0;
    }
    .article-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2.5rem 0;
    }

    /* ─── Back + Related ──── */
    .article-footer {
      margin-top: 4rem;
      padding-top: 2.5rem;
      border-top: 1px solid var(--border);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-head);
      font-weight: 600;
      font-size: .9rem;
      color: var(--ink-muted);
      transition: all .2s;
      margin-bottom: 3rem;
    }
    .back-link:hover { color: var(--accent); gap: 10px; }

    .related-title {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 1.25rem;
    }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }
    .related-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: all .2s;
      display: block;
    }
    .related-card:hover { transform: translateY(-2px); border-color: var(--ink-muted); }
    .related-cat {
      font-family: var(--font-mono);
      font-size: .7rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: .4rem;
    }
    .related-card-title {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: .95rem;
      line-height: 1.3;
      margin-bottom: .4rem;
    }
    .related-card-date {
      font-family: var(--font-mono);
      font-size: .72rem;
      color: var(--ink-muted);
    }

    /* ─── Not found state ──── */
    .not-found {
      text-align: center;
      padding: 4rem 0;
    }
    .not-found h1 {
      font-family: var(--font-head);
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }
    .not-found p { color: var(--ink-muted); margin-bottom: 2rem; }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Lazola<span>.</span>Javu</a>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#projects">Projects</a></li>
      <li><a href="index.html#articles">Articles</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <a href="index.html#contact" class="nav-cta">Get in touch</a>
  </div>
</nav>

<main class="article-page" id="articleContent">
  <p style="color:var(--ink-muted);font-family:var(--font-mono);font-size:.9rem">Loading…</p>
</main>

<script src="articles.js"></script>
<script>
  const CAT_COLORS = {
    'Machine Learning': { bg: '#ddf0e8', text: '#1a5c3a' },
    'Data Engineering':  { bg: '#e0eaf5', text: '#1a4a7a' },
    'Statistics':        { bg: '#ede8fb', text: '#4a2aad' },
    'Visualization':     { bg: '#fef3dc', text: '#92620a' },
    'Career':            { bg: '#fae8e0', text: '#c1440e' },
    'Tutorial':          { bg: '#f7f4ee', text: '#6b6860' },
    'Random Learning':   { bg: '#f7f4ee', text: '#6b6863' },
  };

  function catStyle(cat) {
    const c = CAT_COLORS[cat] || { bg: '#f7f4ee', text: '#6b6860' };
    return `background:${c.bg};color:${c.text}`;
  }

  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function getSlug() {
    const params = new URLSearchParams(window.location.search);
    return params.get('slug');
  }

  function render() {
    const slug = getSlug();
    const article = ARTICLES.find(a => a.slug === slug);
    const container = document.getElementById('articleContent');

    if (!article) {
      container.innerHTML = `
        <div class="not-found">
          <h1>Article not found</h1>
          <p>This article doesn't exist or may have moved.</p>
          <a href="index.html#articles" style="font-family:var(--font-head);font-weight:600;color:var(--accent)">← Back to all articles</a>
        </div>
      `;
      return;
    }

    // Update page title + meta
    document.title = `${article.title} — Lazola Javu`;

    // Related articles (same category, not this one)
    const related = ARTICLES
      .filter(a => a.slug !== slug && a.category === article.category)
      .slice(0, 2);

    container.innerHTML = `
      <nav class="breadcrumb">
        <a href="index.html">Home</a>
        <span class="breadcrumb-sep">/</span>
        <a href="index.html#articles">Articles</a>
        <span class="breadcrumb-sep">/</span>
        <span>${article.title}</span>
      </nav>

      <span class="article-cat-badge" style="${catStyle(article.category)}">${article.category}</span>

      <h1 class="article-h1">${article.title}</h1>

      <div class="article-meta">
        <span class="article-date">${fmtDate(article.date)}</span>
        <span class="meta-sep">·</span>
        <span class="article-read">${article.readTime} read</span>
        <div class="article-tags">
          ${article.tags.map(t => `<span class="article-tag">#${t}</span>`).join('')}
        </div>
      </div>

      <div class="article-body">
        ${article.content}
      </div>

      <div class="article-footer">
        <a href="index.html#articles" class="back-link">← Back to all articles</a>

        ${related.length ? `
          <p class="related-title">More in ${article.category}</p>
          <div class="related-grid">
            ${related.map(r => `
              <a href="article.html?slug=${r.slug}" class="related-card">
                <p class="related-cat">${r.category}</p>
                <p class="related-card-title">${r.title}</p>
                <p class="related-card-date">${fmtDate(r.date)} · ${r.readTime} read</p>
              </a>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }

  render();
</script>
</body>
</html>
